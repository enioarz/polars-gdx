name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Wheels are abi3 (>=3.9), so one wheel per platform is enough.
jobs:
  wheels:
    name: Build wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: "2_28"

      - name: Repair wheel (bundle vendored libgdxcclib64)
        # maturin only auto-bundles external shared libraries into the wheel on
        # Linux. On macOS and Windows the vendored GDX library must be copied
        # in and the references fixed up explicitly.
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          pip install delvewheel
          $dll = Get-ChildItem -Path target -Recurse -Filter gdxcclib64.dll | Select-Object -First 1
          delvewheel repair (Get-ChildItem dist/*.whl | Select-Object -ExpandProperty FullName) -v (Split-Path $dll.FullName) -w repaired
          Move-Item repaired/*.whl dist/ -Force

      - name: Repair wheel (bundle vendored libgdxcclib64)
        if: endsWith(matrix.target, '-apple-darwin')
        run: |
          pip install delocate
          delocate-wheel dist/*.whl -w repaired
          rm -f dist/*.whl && mv repaired/*.whl dist/

      - name: Build SDist
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/

  smoke-test:
    name: Wheel smoke test (${{ matrix.os }})
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Install wheel and test dependencies
        run: |
          pip install polars pyarrow pytest
          pip install --no-index --find-links dist polars-gdx

      - name: Run tests
        run: python -m pytest tests/ -q

  release:
    name: Upload to GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
