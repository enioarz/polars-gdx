name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Verify version matches tag
        run: |
          VERSION="v$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          [ "$VERSION" = "${{ github.ref_name }}" ] || { echo "pyproject version $VERSION != tag ${{ github.ref_name }}"; exit 1; }

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: "2_28"

      - name: Repair wheel (bundle vendored libgdxcclib64)
        # maturin only auto-bundles external shared libraries into the wheel on
        # Linux. On macOS and Windows the vendored GDX library must be copied
        # in and the references fixed up explicitly.
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          pip install delvewheel
          $dll = Get-ChildItem -Path target -Recurse -Filter gdxcclib64.dll | Select-Object -First 1
          delvewheel repair (Get-ChildItem dist/*.whl | Select-Object -ExpandProperty FullName) --add-path (Split-Path $dll.FullName) -w repaired
          Move-Item repaired/*.whl dist/ -Force

      - name: Repair wheel (bundle vendored libgdxcclib64)
        if: endsWith(matrix.target, '-apple-darwin')
        run: |
          pip install delocate
          LIBDIR=$(dirname "$(find target -name 'libgdxcclib64.dylib' | head -1)")
          DYLD_LIBRARY_PATH=$LIBDIR delocate-wheel dist/*.whl -w repaired
          rm -f dist/*.whl && mv repaired/*.whl dist/

      - name: Build SDist
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  pypi-release:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      # Trusted Publishing (OIDC): no token needed. The publisher must be
      # registered on PyPI (owner: enioarz, repo: polars-gdx, workflow:
      # release.yml, environment: pypi).
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
