[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "polars-gdx"
version = "0.6.0"
description = "Lazy, prefiltered Polars reader for GAMS GDX files"
readme = "README.md"
license = "MIT AND Zlib"
license-files = [
  "LICENSE",
  "crates/gdx-sys/third_party/gdx/LICENSE",
  "crates/gdx-sys/third_party/gdx/zlib/LICENSE",
]
requires-python = ">=3.9"
authors = [{ name = "enioarz" }]
keywords = ["polars", "gams", "gdx", "energy-modeling", "optimization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering",
]
dependencies = ["polars>=2.0", "pyarrow>=11"]

[project.urls]
Homepage = "https://github.com/enioarz/polars-gdx"
Repository = "https://github.com/enioarz/polars-gdx"
Issues = "https://github.com/enioarz/polars-gdx/issues"
Changelog = "https://github.com/enioarz/polars-gdx/releases"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "polars_gdx._core"
manifest-path = "crates/polars-gdx/Cargo.toml"
features = ["pyo3/extension-module"]
