name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'docs/') && !startsWith(github.head_ref || github.ref_name, 'chore/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pip install patchelf polars pyarrow pytest
      - run: pip install -e .
      - run: pytest tests/ -q

  benchmark:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'docs/') && !startsWith(github.head_ref || github.ref_name, 'chore/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build extension
        run: |
          pip install patchelf polars pyarrow pandas gamsapi gamspy
          pip install -e .
      - name: Generate large GDX fixture (2M records)
        run: |
          cargo run -p gdx --release --example make_bench -- /tmp/bench_big.gdx 2000000
      - name: Run benchmark vs gamsapi
        run: |
          python benchmarks/bench_vs_gamsapi.py /tmp/bench_big.gdx
      - name: Measure read paths
        run: python benchmarks/bench_read_paths.py /tmp/bench_big.gdx > benchmarks/read-path-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            benchmarks/bench_vs_gamsapi.py
            benchmarks/read-path-results.json
          if-no-files-found: ignore
